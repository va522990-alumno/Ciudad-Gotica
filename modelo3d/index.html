<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ciudad Gótica 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#9eb4c8}canvas{display:block;width:100%;height:100%;touch-action:none}
header{position:fixed;top:12px;left:12px;background:#172333ed;color:white;padding:11px 14px;border-radius:12px;z-index:2}h1{font-size:17px;margin:0 0 4px}small{color:#d0deec}
nav{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:2;flex-wrap:wrap;padding:0 8px}button{background:#203247;color:white;border:1px solid #71869d;border-radius:10px;padding:10px 13px;font-size:13px}
#msg{position:fixed;inset:0;display:grid;place-items:center;background:#101722;color:white;padding:25px;text-align:center;z-index:5}
@media(max-width:600px){h1{font-size:15px}header{top:8px;left:8px;padding:9px 11px}button{padding:9px 11px;font-size:12px}nav{bottom:8px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="msg">Cargando Ciudad Gótica 3D…<br><small>Se necesita conexión a internet.</small></div><header><h1>CIUDAD GÓTICA</h1><small>Arrastra para girar · pellizca para zoom</small></header><nav><button id="home">Vista inicial</button><button id="above">Vista superior</button><button id="names">Ocultar nombres</button></nav><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try{
const canvas=document.querySelector('#c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb4c8);scene.fog=new THREE.Fog(0x9eb4c8,48,95);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);camera.position.set(34,30,38);
const controls=new OrbitControls(camera,canvas);controls.target.set(0,1,1);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.48;controls.minDistance=15;controls.maxDistance=85;
scene.add(new THREE.HemisphereLight(0xffffff,0x59616b,2.1));const sun=new THREE.DirectionalLight(0xffedcf,2.7);sun.position.set(-18,32,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const labels=[];const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.84});
function cube(x,y,z,w,h,d,color,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function tag(t,x,y,z){const cv=document.createElement('canvas');cv.width=512;cv.height=128;const q=cv.getContext('2d');q.fillStyle='#172333eF';q.beginPath();q.roundRect(5,5,502,118,20);q.fill();q.fillStyle='white';q.font='bold 40px Arial';q.textAlign='center';q.textBaseline='middle';q.fillText(t,256,65);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));s.position.set(x,y,z);s.scale.set(4.5,1.1,1);scene.add(s);labels.push(s)}
function building(t,x,z,w,d,h,col,windows=false,roof=0x39424d,baseY=0){const g=new THREE.Group();g.position.set(x,baseY,z);scene.add(g);cube(0,h/2+.08,0,w,h,d,col,g);cube(0,h+.18,0,w+.12,.18,d+.12,roof,g);if(windows){for(let y=.8;y<h-.2;y+=.9)for(let xx=-w/2+.35;xx<w/2-.1;xx+=.65){cube(xx,y,d/2+.025,.34,.42,.04,0x91c6d3,g);cube(xx,y,-d/2-.025,.34,.42,.04,0x91c6d3,g)}}return g}
function ground(x,z,w,d,y,color){cube(x,y,z,w,.12,d,color)}
// Plataforma general, a una sola cota
ground(0,0,40,32,-.38,0x667e5b);ground(0,0,39.4,31.4,-.27,0x789064);
// CIUDAD: calles continuas y manzanas bien definidas
// Calles principales asfaltadas
ground(-1,0,4.2,20,.02,0x303943);ground(-1,0,20,3.8,.045,0x303943);
ground(-7,0,2.5,18,.02,0x303943);ground(5,0,2.5,18,.02,0x303943);
ground(-1,-7,19,.9,.03,0x303943);ground(-1,7,19,.9,.03,0x303943);
ground(-1,-10,20,.5,.03,0xbab8a8);ground(-1,10,20,.5,.03,0xbab8a8);
// Banquetas y marcas viales encima del asfalto
for(let z=-8;z<=8;z+=2)ground(-1,z,.13,.85,.17,0xf1df9c);
for(let x=-10;x<=8;x+=2)ground(x,0,.85,.13,.18,0xf1df9c);
for(const x of [-3.2,1.2])ground(x,0,.22,20,.22,0xb9b7a9);
for(const z of [-2,2])ground(-1,z,20,.22,.24,0xb9b7a9);
// Edificios y comercios en manzanas
building('EDIFICIO 1',-4.8,-4.5,3.1,3,7,0x879ba8,true);
building('EDIFICIO 2',1.8,-4.5,3.1,3,5.3,0xb4a18a,true);
building('EDIFICIO 3',-4.8,4.3,2.7,2.8,3.8,0x9dabb0,true);
building('EDIFICIO 4',2,4.3,2.7,2.8,3.2,0xb6a18c,true);
building('SUPERMERCADO',7.7,-4.5,3.1,3,2.5,0x6b91a8,false,0x435b70);
building('COMERCIO 1',7.7,0,2.8,2.5,2.2,0xb85f4d);
building('COMERCIO 2',7.7,4.1,2.8,2.5,2.2,0x78a58b);
tag('CENTRO DE LA CIUDAD',-1,9.2,8.7);
// Luminarias dentro de la ciudad, pegadas a las banquetas/calles
function lamp(x,z){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,2.25,10),material(0x303942));pole.position.set(x,1.25,z);pole.castShadow=true;scene.add(pole);cube(x+.24,2.32,z,.58,.09,.09,0x303942);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.17,12,10),new THREE.MeshStandardMaterial({color:0xffe8a4,emissive:0xffc64b,emissiveIntensity:1.1}));bulb.position.set(x+.48,2.25,z);scene.add(bulb)}
[[-8,-8],[-8,8],[-3,-8],[-3,8],[2,-8],[2,8],[6,-7],[6,7]].forEach(p=>lamp(p[0],p[1]));
// ZONA RESIDENCIAL, cuatro casas al costado derecho de la ciudad
ground(14,0,9,14,-.08,0x71905e);
const houses=[[12,-4],[16,-4],[12,3],[16,3]],hc=[0xe1c69b,0xd7dfe3,0xc78f72,0xd8b5a1];
houses.forEach((p,i)=>{building('CASA '+(i+1),p[0],p[1],2.4,2.5,1.9,hc[i],false,[0x994d43,0x475a70,0x6c4d42,0x8c5948][i]);cube(p[0],.55,p[1]+1.28,.48,.85,.06,0x493c35)});
tag('ZONA RESIDENCIAL',14,4.2,7.2);
// FRENTE: cerro y planta de luz
// Cerro con cima ancha y aplanada: la planta queda asentada, no en una punta
const hillGeo=new THREE.CylinderGeometry(3.25,7.2,5.4,8);const hill=new THREE.Mesh(hillGeo,material(0x657b4e));hill.position.set(-10,2.5,12);hill.scale.set(1.15,1,1);hill.castShadow=true;hill.receiveShadow=true;scene.add(hill);
// La base del edificio coincide exactamente con la superficie plana de la cima (y=5.2)
building('PLANTA DE LUZ',-10,11.5,3.5,3.1,2.7,0x737c82,false,0x424c55,5.12);
const chimney=new THREE.Mesh(new THREE.CylinderGeometry(.28,.35,2.8,12),material(0x777b80));chimney.position.set(-8.8,9.27,11.1);chimney.castShadow=true;scene.add(chimney);
tag('CERRO · PLANTA DE LUZ',-10,9.4,15.5);
// GRANJA al lado de la planta, con pasto, establo, cultivos y lago
ground(7,11,13,11,-.06,0x8aa36a);
building('GRANJA',3.2,10,3.4,3,2.4,0xb58b5d,false,0x744b37);
for(let r=0;r<3;r++)for(let c=0;c<4;c++){const crop=cube(1.2+c*.62,.22,6.7+r*.62,.18,.35,.18,0x537a3d);}
// Lago a la misma altura de la superficie de la granja
const lake=new THREE.Mesh(new THREE.CylinderGeometry(3.7,3.7,.12,48),new THREE.MeshStandardMaterial({color:0x287caa,roughness:.22,metalness:.12}));lake.scale.z=.72;lake.position.set(10,0.02,12);lake.receiveShadow=true;scene.add(lake);
// orilla alrededor del lago
const shore=new THREE.Mesh(new THREE.TorusGeometry(3.72,.22,8,48),material(0xc5b58a));shore.rotation.x=Math.PI/2;shore.scale.set(1,.72,1);shore.position.set(10,.08,12);scene.add(shore);
// Puente peatonal sobre el lago, apoyado a nivel de orilla
const bridge=new THREE.Group();bridge.position.set(10,.22,12);scene.add(bridge);cube(0,0,0,1.45,.22,5.5,0x8b6848,bridge);for(const x of [-.68,.68])cube(x,.35,0,.1,.55,5.5,0x514a42,bridge);
tag('PUENTE SOBRE EL LAGO',10,1.5,8.5);
// Camino conecta ciudad, granja y cerro
ground(4,9,2.2,8,.02,0x9b927b);ground(0,11,8,.9,.025,0x9b927b);
// Marco de la maqueta
for(const [x,z,w,d] of [[0,-16,40,.22],[0,16,40,.22],[-20,0,.22,32],[20,0,.22,32]])cube(x,-.05,z,w,.3,d,0x39434a);
document.querySelector('#home').onclick=()=>{camera.position.set(34,30,38);controls.target.set(0,1,1);controls.update()};
document.querySelector('#above').onclick=()=>{camera.position.set(0,48,.1);controls.target.set(0,0,0);controls.update()};
let visible=true;document.querySelector('#names').onclick=()=>{visible=!visible;labels.forEach(x=>x.visible=visible);document.querySelector('#names').textContent=visible?'Ocultar nombres':'Mostrar nombres'};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();document.querySelector('#msg').remove();
}catch(e){document.querySelector('#msg').textContent='No se pudo cargar el modelo. Abre con Chrome o Safari y verifica tu conexión a internet. '+e.message;console.error(e)}
</script></body></html>
